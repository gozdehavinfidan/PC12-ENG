<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC12 Morfoloji Analizi — ENG400 Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129516;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <aside class="side">
    <div class="brand">
      <div class="dot">PC</div>
      <h1 id="projName">PC12 Morfoloji Analizi</h1>
      <p id="projSub">ENG400</p>
    </div>

    <nav class="nav" role="tablist" aria-label="Görünümler">
      <button data-v="overview" role="tab" aria-selected="true"><span class="ico">◧</span>Genel bakış</button>
      <button data-v="gantt"    role="tab" aria-selected="false"><span class="ico">▤</span>Zaman çizelgesi</button>
      <button data-v="board"    role="tab" aria-selected="false"><span class="ico">▥</span>Görev panosu</button>
      <button data-v="sunum"    role="tab" aria-selected="false"><span class="ico">◈</span>Sunum planı</button>
      <button data-v="risk"     role="tab" aria-selected="false"><span class="ico">⚑</span>Risk &amp; karar</button>
    </nav>

    <!-- who am I: sets the author of every event appended to data.txt -->
    <div id="meBox"></div>
    <!-- sync state + save actions -->
    <div id="syncBox"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="viewTitle">Genel bakış</h2>
    </div>
    <div id="view"><noscript>
      <div class="card">Bu dashboard JavaScript gerektirir.</div>
    </noscript></div>
  </main>

</div>

<!-- task detail / add-task / token dialogs render here -->
<div id="drawer"></div>

<!-- data.js MUST load before app.js. Classic scripts (no type="module") are
     exempt from CORS, so this works identically from file:// and from Pages.
     See llm-wiki/DECISIONS.md D7. -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
